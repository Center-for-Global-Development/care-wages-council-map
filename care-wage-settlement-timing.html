<!doctype html>
<html lang="en" data-cgd-interactive-name="care-wages-settlement-timing">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>When care workers on care visas reach settlement</title>
<link rel="stylesheet" href="shared/cgd-figure.css?v=20261109b">
<link rel="stylesheet" href="shared/cgd-responsive.css?v=20261109b">
<style>
  /* Two toggles side by side on wide screens, stacked on phones. */
  #controls{display:grid;grid-template-columns:repeat(2,minmax(0,300px));align-items:end;gap:6px 14px}
  #controls .control-group{min-width:0}
  #controls .segmented{width:100%}
  #controls .segmented button{flex:1 1 0;white-space:nowrap}

  .key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.2px;color:var(--cgd-dark-gray);align-items:center}
  .key span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .key i{display:inline-block;width:14px;height:9px;border-radius:2px}
  .panel-title{white-space:normal}

  .bars{width:100%}
  /* Colour = route; paler = already passed. */
  .bar.abroad{fill:var(--cgd-light-teal)}
  .bar.switch{fill:var(--cgd-gold)}
  .bar.past{opacity:.35}
  .period:focus-visible .bar{stroke:var(--cgd-gold);stroke-width:2}
  .period .hit{fill:transparent}
  .bar-value{fill:var(--cgd-teal-black);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
  .year-label{fill:var(--cgd-teal);font-size:11.5px;font-weight:700}
  .q-label{fill:var(--cgd-dark-gray);font-size:9.5px}
  .band{fill:#E9F1F5}
  .band-label{fill:var(--cgd-teal-black);font-size:10.5px}
  .now-line{stroke:var(--cgd-dark-gray);stroke-width:1;stroke-dasharray:3 3}
  .now-label{fill:var(--cgd-dark-gray);font-size:10.5px}

  #notes{font-size:9.6px;line-height:1.3;margin-top:8px;padding-top:6px}
  #notes a{color:var(--cgd-teal);text-decoration:underline;text-underline-offset:1px}

  @media (max-width:640px){
    #controls{grid-template-columns:minmax(0,1fr)}
    .panel-header{grid-template-columns:minmax(0,1fr)}
  }
</style>
</head>
<body>
<main id="vizRoot" class="viz-wrapper">
  <div class="header-row">
    <div class="title-block">
      <h1 id="vizTitle">Most care workers recruited on care visas reach five years in the UK in 2027 and 2028</h1>
    </div>
    <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" data-tip="View fullscreen">
      <svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="controls" id="controls" aria-label="Chart controls">
    <div class="control-group">
      <div class="control-label" id="periodLabel">Show by</div>
      <div class="segmented" id="periodToggle" role="group" aria-labelledby="periodLabel">
        <button type="button" data-period="quarter" aria-pressed="true">Quarter</button>
        <button type="button" data-period="year" aria-pressed="false">Year</button>
      </div>
    </div>
    <div class="control-group">
      <div class="control-label" id="countLabel">Count</div>
      <div class="segmented" id="countToggle" role="group" aria-labelledby="countLabel">
        <button type="button" data-count="all" aria-pressed="true" data-tip="Every care worker visa granted before the May 2025 White Paper, from abroad or by switching from a student visa in the UK">All visas granted</button>
        <button type="button" data-count="qualify" aria-pressed="false" data-tip="Scaled by the Home Office's indicative share expected to meet the five-year requirements (146,000 of 196,000, about three-quarters)">Expected to qualify</button>
      </div>
    </div>
  </div>

  <section class="panel">
    <div class="panel-header">
      <h2 class="panel-title" id="panelTitle"></h2>
      <div class="key" aria-hidden="true">
        <span><i style="background:var(--cgd-light-teal)"></i>Granted from abroad</span>
        <span><i style="background:var(--cgd-gold)"></i>Switched from a student visa in the UK</span>
      </div>
    </div>
    <div class="chart-area"><div class="bars" id="bars"></div></div>
  </section>
  <div class="notes" id="notes"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</main>

<script src="shared/dom.js?v=20261109b"></script>
<script src="shared/chart-core.js?v=20261109b"></script>
<script src="data/settlement-timing-data.js?v=20261109b"></script>
<script>
(() => {
  'use strict';
  const { element, svgEl } = window.CGDDom;
  const { observeInlineSize, createSvg } = window.CGDCore;
  const T = window.CARE_SETTLEMENT_TIMING;
  const QUALIFY = T.hoQualify / T.hoDue;   // indicative share meeting the five-year requirements
  // Axis held fixed for each view, so switching the count shrinks the bars rather than rescaling.
  const AXIS = { quarter: { max: 45000, ticks: [0, 10000, 20000, 30000, 40000] },
                 year: { max: 150000, ticks: [0, 50000, 100000, 150000] } };

  const nf0 = new Intl.NumberFormat('en-GB', { maximumFractionDigits: 0 });
  const round = v => v >= 10000 ? Math.round(v / 1000) * 1000 : v >= 1000 ? Math.round(v / 100) * 100 : Math.round(v / 10) * 10;
  const fmt = v => nf0.format(round(v));
  const fmtTick = v => v === 0 ? '0' : nf0.format(v / 1000) + 'k';

  // Quarter index: year * 4 + (quarter - 1). "Now" is the current calendar quarter, counted as still to come.
  const qIndex = s => Number(s.slice(0, 4)) * 4 + Number(s.slice(-1)) - 1;
  const today = new Date();
  const NOW = today.getFullYear() * 4 + Math.floor(today.getMonth() / 3);
  const Q = T.quarters.map(r => ({ ...r, i: qIndex(r.q), year: r.q.slice(0, 4) }));

  let state = Object.freeze({ period: 'quarter', count: 'all' });
  const setState = patch => { state = Object.freeze({ ...state, ...patch }); render(); };
  const scale = () => state.count === 'qualify' ? QUALIFY : 1;

  document.getElementById('periodToggle').addEventListener('click', e => {
    const b = e.target.closest('button[data-period]'); if (!b) return;
    setState({ period: b.dataset.period });
    window.CGDTracking?.engagement('view_control', 'timing_period', b.dataset.period);
  });
  document.getElementById('countToggle').addEventListener('click', e => {
    const b = e.target.closest('button[data-count]'); if (!b) return;
    setState({ count: b.dataset.count });
    window.CGDTracking?.engagement('view_control', 'timing_count', b.dataset.count);
  });

  /* Periods to draw. Each holds four parts: route (abroad / switched) x timing (passed / to come);
     a quarter is wholly passed or to come, a year can be both. */
  function periods() {
    const k = scale(), out = [];
    Q.forEach(r => {
      const key = state.period === 'quarter' ? r.q : r.year;
      let p = out.find(o => o.key === key);
      if (!p) {
        p = { key, label: state.period === 'quarter' ? 'Q' + r.q.slice(-1) : r.year, year: r.year, grants: [], ap: 0, af: 0, sp: 0, sf: 0 };
        out.push(p);
      }
      p.grants.push(r.grant);
      if (r.i < NOW) { p.ap += r.n * k; p.sp += r.s * k; } else { p.af += r.n * k; p.sf += r.s * k; }
    });
    out.forEach(p => { p.abroad = p.ap + p.af; p.switched = p.sp + p.sf; p.past = p.ap + p.sp; p.total = p.abroad + p.switched; });
    return out;
  }

  /* ---- Tooltip ---- */
  const tooltip = document.getElementById('tooltip');
  function tipFor(p) {
    const grid = element('div', { className: 'tooltip-grid' });
    const row = (k, v) => grid.append(element('span', { text: k }), element('b', { text: v }));
    row('Visa granted in', p.grants.length === 1 ? p.grants[0] : p.grants[0].slice(0, 4));
    row('Granted from abroad', 'about ' + fmt(p.abroad));
    row('Switched from a student visa', 'about ' + fmt(p.switched));
    row(state.count === 'qualify' ? 'Total expected to qualify' : 'Total', 'about ' + fmt(p.total));
    if (state.count === 'all') row('Expected to qualify', 'about ' + fmt(p.total * QUALIFY));
    if (p.past && p.past < p.total) row('Of which already passed', 'about ' + fmt(p.past));
    return [element('strong', { text: `Reach five years in ${p.key}` }), grid];
  }
  function showTip(p, x, y) {
    const host = document.fullscreenElement || document.getElementById('vizRoot');
    if (tooltip.parentNode !== host) host.append(tooltip);
    tooltip.replaceChildren(...tipFor(p));
    tooltip.hidden = false;
    const pad = 8, box = tooltip.getBoundingClientRect(), vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    let l = x + 14, t = y + 14;
    if (l + box.width > vw - pad) l = x - box.width - 14;
    if (t + box.height > vh - pad) t = y - box.height - 14;
    tooltip.style.left = Math.max(pad, Math.min(l, vw - box.width - pad)) + 'px';
    tooltip.style.top = Math.max(pad, Math.min(t, vh - box.height - pad)) + 'px';
  }
  const hideTip = () => { tooltip.hidden = true; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
  document.addEventListener('scroll', hideTip, true);

  /* ---- Chart ---- */
  const wrap = document.getElementById('bars');
  let lastWidth = 0;
  function draw(width) {
    lastWidth = width;
    const data = periods(), ax = AXIS[state.period], quarter = state.period === 'quarter';
    const compact = width < 520;
    const height = compact ? 280 : 340;
    const m = { top: 30, right: 6, bottom: quarter ? 36 : 22, left: 36 };
    const plotW = width - m.left - m.right, plotH = height - m.top - m.bottom;
    const step = plotW / data.length, barW = Math.max(3, step * (quarter ? 0.72 : 0.62));
    const x = i => m.left + i * step + (step - barW) / 2;
    const y = v => m.top + plotH - Math.min(v, ax.max) / ax.max * plotH;
    const svg = createSvg(wrap, width, height, 'Bar chart: care worker visas granted from abroad by when holders reach five years in the UK');
    const y0 = m.top + plotH;

    // 2028 band: in-country switching ends (July) and the first Fair Pay Agreement is due.
    const in28 = data.map((d, i) => d.year === '2028' ? i : -1).filter(i => i >= 0);
    if (in28.length) {
      const bx = m.left + in28[0] * step, bw = in28.length * step;
      svg.append(svgEl('rect', { class: 'band', x: bx, y: 0, width: bw, height: y0 }));
      const lines = compact ? ['2028: switching ends,', 'Fair Pay Agreement due'] : ['2028: in-country switching ends (July);', 'first Fair Pay Agreement due'];
      // Quarter view: label beside the band (left of it when narrow, where the right side has no room).
      const anchorX = !quarter ? bx + bw / 2 : compact ? bx - 4 : bx + bw + 6;
      const t = svgEl('text', { class: 'band-label', x: anchorX, y: 11, 'text-anchor': !quarter ? 'middle' : compact ? 'end' : 'start' });
      lines.forEach((l, j) => { const s = svgEl('tspan', { x: anchorX, dy: j ? 12 : 0 }); s.textContent = l; t.append(s); });
      svg.append(t);
    }

    const axis = svgEl('g', { class: 'axis' });
    ax.ticks.forEach(t => {
      axis.append(svgEl('line', { class: 'grid-line', x1: m.left, y1: y(t), x2: width - m.right, y2: y(t) }));
      const lab = svgEl('text', { x: m.left - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'small-text' });
      lab.textContent = fmtTick(t);
      axis.append(lab);
    });
    svg.append(axis);

    // "Now" marker in the quarter view, at the start of the current quarter.
    if (quarter) {
      const ni = data.findIndex(d => qIndex(d.key) >= NOW);
      if (ni > 0) {
        const nx = m.left + ni * step;
        svg.append(svgEl('line', { class: 'now-line', x1: nx, y1: m.top - 4, x2: nx, y2: y0 }));
        const nl = svgEl('text', { class: 'now-label', x: nx + 4, y: m.top + 6 }); nl.textContent = 'Now'; svg.append(nl);
      }
    }

    data.forEach((d, i) => {
      const tot = d.total;
      const g = svgEl('g', { class: 'period', tabindex: '0', role: 'listitem',
        'aria-label': `Reach five years in ${d.key}: about ${fmt(tot)} (${fmt(d.abroad)} from abroad, ${fmt(d.switched)} switched in the UK)` });
      g.append(svgEl('rect', { class: 'hit', x: m.left + i * step, y: m.top, width: step, height: plotH }));
      // Stack bottom-up: abroad passed, abroad to come, switched passed, switched to come.
      let base = 0;
      [['ap', 'abroad past'], ['af', 'abroad'], ['sp', 'switch past'], ['sf', 'switch']].forEach(([k, cls]) => {
        if (!d[k]) return;
        g.append(svgEl('rect', { class: 'bar ' + cls, x: x(i), y: y(base + d[k]), width: barW, height: y(base) - y(base + d[k]) }));
        base += d[k];
      });
      if (!quarter) {
        const v = svgEl('text', { class: 'bar-value', x: x(i) + barW / 2, y: y(tot) - 5, 'text-anchor': 'middle' });
        v.textContent = fmt(tot); g.append(v);
      }
      g.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') showTip(d, e.clientX, e.clientY); });
      g.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' && !tooltip.hidden) showTip(d, e.clientX, e.clientY); });
      g.addEventListener('pointerleave', hideTip);
      g.addEventListener('click', e => { const b = g.getBoundingClientRect(); showTip(d, e.clientX || b.left + b.width / 2, e.clientY || b.top + 20); });
      g.addEventListener('focus', () => { const b = g.getBoundingClientRect(); showTip(d, b.left + b.width / 2, b.top + 20); });
      g.addEventListener('blur', hideTip);
      svg.append(g);
    });

    // x labels: quarters (hidden when narrow) with the year centred beneath; or the year alone.
    const years = [...new Set(data.map(d => d.year))];
    years.forEach(yr => {
      const idx = data.map((d, i) => d.year === yr ? i : -1).filter(i => i >= 0);
      const cx = m.left + (idx[0] + idx[idx.length - 1] + 1) / 2 * step;
      const yl = svgEl('text', { class: 'year-label', x: cx, y: y0 + (quarter ? 30 : 16), 'text-anchor': 'middle' });
      yl.textContent = yr; svg.append(yl);
      if (quarter && idx[0] > 0) svg.append(svgEl('line', { class: 'grid-line', x1: m.left + idx[0] * step, y1: y0, x2: m.left + idx[0] * step, y2: y0 + 34 }));
    });
    if (quarter && step >= 16) data.forEach((d, i) => {
      const ql = svgEl('text', { class: 'q-label', x: x(i) + barW / 2, y: y0 + 13, 'text-anchor': 'middle' });
      ql.textContent = compact ? d.label.slice(1) : d.label; svg.append(ql);
    });
  }

  /* ---- Notes ---- */
  const SOURCES = {
    ho: ['Home Office sponsored work visas by occupation (year ending June 2026)', 'https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables'],
    mo: ['Migration Observatory', 'https://migrationobservatory.ox.ac.uk/resources/commentaries/international-students-entering-the-uk-labour-market/'],
    es: ['Earned Settlement consultation response', 'https://assets.publishing.service.gov.uk/media/6ae89fddf4a6b3f59cf37580/FINAL_VERSION_-_Earned_Settlement_-_Consultation_Response.pdf']
  };
  function renderNotes() {
    const link = key => element('a', { text: SOURCES[key][0], attributes: { href: SOURCES[key][1], target: '_blank', rel: 'noopener' } });
    document.getElementById('notes').replaceChildren(
      'Source: CGD analysis of ', link('ho'), '; Home Office FOI data published by the ', link('mo'), '; ', link('es'), ' (November 2026). ',
      'Health and Care Worker visas granted from abroad to care workers (main applicants, caring personal services), and certificates of sponsorship used by people switching into care work from a student visa in the UK (FOI data to 2026 Q1), placed five years after the quarter of grant; time on a student visa does not count towards settlement. ',
      'Only visas granted before the White Paper of 12 May 2025 are shown, since later entrants face a 10-year route; 2025 Q2 is split pro rata. ',
      'The chart excludes switchers from the Graduate route and other in-country routes, and includes some who have since left the UK or the sector. ',
      'The Home Office expects about 196,000 care workers in all to be due to settle in 2026–30, about 146,000 of them meeting the requirements for the five-year route; "expected to qualify" applies that share to every quarter. ',
      'Reaching five years allows an application for settlement; it does not mean leaving care.');
  }

  function render() {
    document.querySelectorAll('#periodToggle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.period === state.period)));
    document.querySelectorAll('#countToggle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.count === state.count)));
    document.getElementById('panelTitle').textContent = state.count === 'qualify'
      ? 'Care workers expected to qualify for settlement after five years' : 'Care worker visas granted';
    hideTip();
    draw(lastWidth || Math.max(280, Math.floor(wrap.getBoundingClientRect().width) || 600));
  }

  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    const r = document.getElementById('vizRoot');
    if (document.fullscreenElement === r) document.exitFullscreen(); else r.requestFullscreen?.();
  });

  renderNotes();
  render();
  observeInlineSize(wrap, w => draw(w));
  window.CGD_READY = true;
})();
</script>
<script src="shared/cgd-embed.js?v=20261109b"></script>
</body>
</html>
